name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # ── Static analysis ──────────────────────────────────────────────────────

      - name: Run go vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        run: staticcheck ./...

      # ── Tests ────────────────────────────────────────────────────────────────

      - name: Run tests with race detector and coverage
        run: |
          go test -v -race -covermode=atomic \
            -coverprofile=coverage.out \
            ./config/... ./internal/...

      - name: Enforce minimum coverage (60%)
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total package coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 60" | bc -l) )); then
            echo "❌ Coverage ${COVERAGE}% is below the required 60% threshold."
            exit 1
          else
            echo "✅ Coverage ${COVERAGE}% meets the 60% threshold."
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 14

      # ── Cross-compilation check ───────────────────────────────────────────────

      - name: Build — Linux amd64
        run: GOOS=linux GOARCH=amd64 go build -o /dev/null .

      - name: Build — macOS arm64
        run: GOOS=darwin GOARCH=arm64 go build -o /dev/null .

      - name: Build — Windows amd64
        run: GOOS=windows GOARCH=amd64 go build -o /dev/null .
